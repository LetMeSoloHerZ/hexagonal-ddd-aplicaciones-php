# DocumentRoot en la raiz del proyecto: el .htaccess redirige todo a public/index.php
# y las vistas cargan los .js con rutas relativas (../Infrastructure/...).
ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
