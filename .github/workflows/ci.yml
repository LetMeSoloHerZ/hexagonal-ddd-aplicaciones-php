name: CI/CD

on:
  push:
  pull_request:

jobs:
  lint:
    name: Sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: php -l en todos los archivos
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "Error de sintaxis en $f"; status=1; }
          done < <(find . -name "*.php" -not -path "./.git/*" -print0)
          exit $status

  smoke-test:
    name: Prueba de humo con MySQL
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring
      - name: Crear esquema y datos de ejemplo
        run: |
          DIR=Infrastructure/Adapters/Persistence/MySQL/Database/mysql
          mysql -h 127.0.0.1 -uroot -proot_ci < "$DIR/database.sql"
          mysql -h 127.0.0.1 -uroot -proot_ci < "$DIR/aplicaciones.sql"
      - name: Levantar la aplicacion
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: crud_usuarios
          DB_USERNAME: root
          DB_PASSWORD: root_ci
        run: |
          php -S 127.0.0.1:8080 -t public > server.log 2>&1 &
          sleep 2
      - name: Ejecutar prueba de humo
        env:
          BASE_URL: http://127.0.0.1:8080/index.php
        run: ./scripts/smoke-test.sh
      - name: Log del servidor (si falla)
        if: failure()
        run: cat server.log

  docker-build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aplicaciones-php .

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [smoke-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar despliegue (deploy hook)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL: se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
